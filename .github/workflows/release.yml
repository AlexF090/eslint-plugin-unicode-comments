name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # No dependency cache: a poisoned cache entry would run in the job that
      # can publish.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Every step of this job can request the OIDC token for publishing, and
      # type-check, lint, test, and build run dependency code. Skipping install
      # and lifecycle scripts keeps code from running implicitly; it does not
      # isolate the token from the dependencies the steps below execute.
      - run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run lint:package
      # dist/ is built above; --ignore-scripts keeps prepack (a rebuild) and
      # prepare (husky) from running inside the publish command.
      - run: npm publish --ignore-scripts
